{{ if $.Param "enableLangChange" }}
<div class="dropdown">
  <button class="dropdown-trigger" aria-label="Select Language Button">
    {{ partial "svgs/etc/translate.svg" (dict "width" 24 "height" 24) }}
  </button>
  <div class="dropdown-content">
    {{ $pageLang := .Page.Lang }}
      {{ range .Page.AllTranslations }}
        {{ if .Language.Label }}
          <a href="{{ .RelPermalink }}" data-lang="{{ .Lang }}" class="dropdown-item{{ if eq $pageLang .Lang }} is-active{{ end }}">{{ .Language.Label }}</a>
        {{ end }}
      {{ end }}
  </div>
</div>
{{ end }}
